packages:
    - apps/*
    - packages/*

catalog:
    # tooling
    typescript: ^5
    eslint: ^9.39.4
    typescript-eslint: ^8.61.0
    # react
    react: ^19
    react-dom: ^19
    "@types/react": ^19
    "@types/react-dom": ^19
    "@types/node": ^20
    # domain
    bcryptjs: ^3.0.3
    "@types/bcryptjs": ^3.0.0
    drizzle-orm: ^0.45.2

allowBuilds:
    esbuild: true
    sharp: true
    unrs-resolver: true

ignoredBuiltDependencies:
    - sharp
    - unrs-resolver
