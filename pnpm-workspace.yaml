packages:
    - apps/*
    - packages/*

catalog:
    # tooling
    typescript: ^5
    eslint: ^9.39.4
    typescript-eslint: ^8.61.0
    prettier: ^3.9.5
    eslint-config-prettier: ^10.1.8
    # react
    react: ^19
    react-dom: ^19
    '@types/react': ^19
    '@types/react-dom': ^19
    '@types/node': ^20
    lucide-react: ^1.22.0
    # domain
    bcryptjs: ^3.0.3
    '@types/bcryptjs': ^3.0.0
    drizzle-orm: 1.0.0-rc.4
    zod: ^4.4.3

allowBuilds:
    esbuild: true
    sharp: true
    unrs-resolver: true

ignoredBuiltDependencies:
    - sharp
    - unrs-resolver
