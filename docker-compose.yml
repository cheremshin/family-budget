name: family-budget

x-hardening: &hardening
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
        driver: json-file
        options:
            max-size: 10m
            max-file: '3'

services:
    postgres:
        <<: *hardening
        image: postgres:16-alpine
        restart: unless-stopped
        cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
            # Для docker/postgres/initdb/10-roles.sh
            MIGRATE_DB_USER: ${MIGRATE_DB_USER:?MIGRATE_DB_USER не задан в .env}
            MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD не задан в .env}
            APP_DB_USER: ${APP_DB_USER:?APP_DB_USER не задан в .env}
            APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD не задан в .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
        networks: [backend]
        shm_size: 128m
        mem_limit: 512m
        pids_limit: 200
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 3s
            retries: 10

    migrate:
        <<: *hardening
        profiles: [app]
        image: family-budget-migrate:${IMAGE_TAG:-latest}
        build:
            context: .
            target: migrate
        environment:
            DATABASE_URL: postgres://${MIGRATE_DB_USER}:${MIGRATE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
        networks: [backend]
        read_only: true
        tmpfs: [/tmp]
        mem_limit: 512m
        depends_on:
            postgres:
                condition: service_healthy

    web:
        <<: *hardening
        profiles: [app]
        image: family-budget-web:${IMAGE_TAG:-latest}
        build:
            context: .
            target: runner
            args:
                GIT_SHA: ${GIT_SHA:-unknown}
        restart: unless-stopped
        stop_grace_period: 15s
        environment:
            DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
            SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET не задан в .env}
        networks: [backend, frontend]
        ports:
            - '127.0.0.1:3001:3000'
        read_only: true
        tmpfs:
            - /tmp
            - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700
        mem_limit: 768m
        pids_limit: 200
        depends_on:
            migrate:
                condition: service_completed_successfully

networks:
    backend:
        internal: true
    frontend:

volumes:
    postgres_data:
